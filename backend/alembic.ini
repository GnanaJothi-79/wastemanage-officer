[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; default: %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to PYTHONPATH
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected
# sourceless = false

# version location specification; this defaults to alembic/versions
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# the output encoding used when revision files are written from console
# output_encoding = utf-8

sqlalchemy.url = postgresql://neondb_owner:npg_zuIm26UqLnCf@ep-shiny-recipe-amwhsph3-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require

[post_write_hooks]
# hooks to run after generating a new migration script
# hooks = black, ruff

# black
# type = console_scripts
# entrypoint = black
# options = --line-length 88

# ruff
# type = console_scripts
# entrypoint = ruff
# options = --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S